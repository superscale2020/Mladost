<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apartment for Sale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F7F3EE;
      --cream-dark: #EDE7DE;
      --ink: #1C1A18;
      --ink-soft: #4A443D;
      --ink-muted: #8C857C;
      --gold: #B8844A;
      --gold-light: #D4A870;
      --white: #FDFCFA;
      --sidebar-w: 280px;
      --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--ink);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      z-index: 100;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 2.5rem 2rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-eyebrow {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 0.75rem;
    }

    .sidebar-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.6rem;
      color: var(--white);
      line-height: 1.2;
    }

    .sidebar-title span {
      display: block;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--gold-light);
      margin-top: 0.2rem;
    }

    .sidebar-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 1.25rem;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }

    .meta-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .rooms-label {
      padding: 1.2rem 2rem 0.6rem;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .rooms-nav {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .rooms-nav::-webkit-scrollbar { width: 3px; }
    .rooms-nav::-webkit-scrollbar-track { background: transparent; }
    .rooms-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    .room-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.7rem 2rem;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      color: rgba(255,255,255,0.55);
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.04em;
      transition: color var(--transition), background var(--transition);
      position: relative;
    }

    .room-btn::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%) scaleY(0);
      width: 2px; height: 60%;
      background: var(--gold);
      transition: transform var(--transition);
    }

    .room-btn:hover {
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.04);
    }

    .room-btn.active {
      color: var(--white);
      background: rgba(255,255,255,0.06);
    }

    .room-btn.active::before { transform: translateY(-50%) scaleY(1); }

    .room-count {
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.25);
      font-style: italic;
    }

    .room-btn.active .room-count { color: var(--gold); }

    .sidebar-footer {
      padding: 1.2rem 2rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .contact-cta {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      background: var(--gold);
      color: var(--white);
      border: none;
      border-radius: 2px;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background var(--transition);
    }

    .contact-cta:hover { background: var(--gold-light); }

    /* ── MAIN CONTENT ── */
    #main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      padding: 2rem 2.5rem 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    .room-heading {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 4vw, 3.2rem);
      color: var(--ink);
      line-height: 1;
    }

    .room-heading em {
      font-style: italic;
      color: var(--ink-soft);
    }

    .photo-count-label {
      font-size: 12px;
      font-weight: 300;
      color: var(--ink-muted);
      letter-spacing: 0.08em;
      white-space: nowrap;
      padding-bottom: 0.4rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, var(--gold), transparent);
      margin: 1rem 2.5rem 0;
    }

    /* ── GALLERY GRID ── */
    #gallery {
      padding: 1.8rem 2.5rem 3rem;
      flex: 1;
    }

    .gallery-grid {
      columns: 3;
      column-gap: 12px;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      cursor: pointer;
      background: var(--cream-dark);
      break-inside: avoid;
      margin-bottom: 12px;
      display: block;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s;
    }

    .photo-card:hover img { transform: scale(1.04); }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(28,26,24,0.35), transparent 50%);
      opacity: 0;
      transition: opacity var(--transition);
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }

    .photo-card:hover .photo-overlay { opacity: 1; }

    .expand-icon {
      width: 32px; height: 32px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-left: auto;
    }

    .expand-icon svg { width: 14px; height: 14px; stroke: white; fill: none; }

    /* Placeholder when no images */
    .no-photos {
      grid-column: 1 / -1;
      padding: 4rem 2rem;
      text-align: center;
      color: var(--ink-muted);
    }

    .no-photos p { font-size: 14px; font-weight: 300; }
    .no-photos .hint {
      margin-top: 0.5rem;
      font-size: 12px;
      font-family: 'Jost', sans-serif;
      color: var(--gold);
      opacity: 0.7;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(20, 18, 16, 0.96);
      align-items: center;
      justify-content: center;
    }

    #lightbox.open { display: flex; }

    .lb-img-wrap {
      position: relative;
      max-width: 88vw;
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lb-img {
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      display: block;
    }

    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition);
      z-index: 10;
    }

    .lb-btn:hover { background: rgba(255,255,255,0.18); }
    .lb-btn svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 1.5; }
    #lb-prev { left: -60px; }
    #lb-next { right: -60px; }

    #lb-close {
      position: fixed;
      top: 1.5rem; right: 1.5rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition);
    }

    #lb-close:hover { background: rgba(255,255,255,0.2); }
    #lb-close svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 1.5; }

    #lb-counter {
      position: fixed;
      bottom: 1.5rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.15em;
    }

    #lb-caption {
      position: fixed;
      bottom: 3rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }

    /* ── MOBILE TOGGLE ── */
    #menu-toggle {
      display: none;
      position: fixed;
      top: 1rem; left: 1rem;
      z-index: 200;
      background: var(--ink);
      border: none;
      border-radius: 3px;
      width: 40px; height: 40px;
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    #menu-toggle span {
      display: block;
      width: 20px; height: 1.5px;
      background: rgba(255,255,255,0.7);
      transition: var(--transition);
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      :root { --sidebar-w: 260px; }

      #sidebar {
        transform: translateX(-100%);
        transition: transform var(--transition);
      }

      #sidebar.open { transform: translateX(0); }
      #overlay.open { display: block; }
      #menu-toggle { display: flex; }

      #main { margin-left: 0; }
      .topbar { padding-top: 3.5rem; }

      .gallery-grid { columns: 2; }
    }

    @media (max-width: 600px) {
      #gallery { padding: 1.2rem 1rem 2rem; }
      .topbar { padding: 3.5rem 1rem 0; }
      .divider { margin: 1rem 1rem 0; }
      .gallery-grid { columns: 2; column-gap: 8px; }
      .photo-card { margin-bottom: 8px; }
      #lb-prev { left: -48px; }
      #lb-next { right: -48px; }
    }

    /* ── FADE ANIMATION ── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .photo-card {
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }

    .photo-card:nth-child(1) { animation-delay: 0.05s; }
    .photo-card:nth-child(2) { animation-delay: 0.1s; }
    .photo-card:nth-child(3) { animation-delay: 0.15s; }
    .photo-card:nth-child(4) { animation-delay: 0.2s; }
    .photo-card:nth-child(5) { animation-delay: 0.25s; }
    .photo-card:nth-child(6) { animation-delay: 0.3s; }
    .photo-card:nth-child(n+7) { animation-delay: 0.35s; }
  </style>
</head>
<body>

<!-- Mobile menu toggle -->
<button id="menu-toggle" aria-label="Open menu">
  <span></span><span></span><span></span>
</button>
<div id="overlay"></div>

<!-- ── SIDEBAR ── -->
<nav id="sidebar" aria-label="Room navigation">
  <div class="sidebar-header">
    <p class="sidebar-eyebrow">Продава</p>
    <h1 class="sidebar-title" id="apt-title">
      Apartment<span id="apt-subtitle"></span>
    </h1>
    <div class="sidebar-meta" id="apt-details"></div>
  </div>

  <p class="rooms-label">Rooms</p>
  <div class="rooms-nav" id="rooms-nav"></div>

  <div class="sidebar-footer">
    <a id="contact-btn" class="contact-cta" href="#">Enquire Now</a>
  </div>
</nav>

<!-- ── MAIN ── -->
<main id="main">
  <div class="topbar">
    <h2 class="room-heading" id="room-heading">Select a Room</h2>
    <p class="photo-count-label" id="photo-count"></p>
  </div>
  <div class="divider"></div>

  <section id="gallery" aria-live="polite">
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

<!-- ── LIGHTBOX ── -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lb-close" aria-label="Close">
    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

    <button class="lb-btn" id="lb-next" aria-label="Next photo">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div id="lb-caption"></div>
  <div id="lb-counter"></div>
</div>

<script>
(function () {
  // ── Init metadata ──────────────────────────────────────
  document.getElementById('apt-title').childNodes[0].textContent = APARTMENT.title;
  const sub = document.getElementById('apt-subtitle');
  sub.textContent = APARTMENT.subtitle;

  const detailsEl = document.getElementById('apt-details');
  APARTMENT.details.forEach(d => {
    const el = document.createElement('div');
    el.className = 'meta-item';
    el.innerHTML = `<span class="meta-dot"></span><span>${d}</span>`;
    detailsEl.appendChild(el);
  });

  const contactBtn = document.getElementById('contact-btn');
  contactBtn.href = `mailto:${CONTACT.email}?subject=Enquiry: ${encodeURIComponent(APARTMENT.title)}`;
  contactBtn.title = `${CONTACT.phone}`;

  // ── Build sidebar nav ──────────────────────────────────
  const nav = document.getElementById('rooms-nav');

  ROOMS.forEach((room, i) => {
    const btn = document.createElement('button');
    btn.className = 'room-btn';
    btn.setAttribute('data-index', i);
    btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML = `<span>${room.name}</span><span class="room-count">${room.images.length} photo${room.images.length !== 1 ? 's' : ''}</span>`;
    btn.addEventListener('click', () => showRoom(i));
    nav.appendChild(btn);
  });

  // ── Gallery rendering ──────────────────────────────────
  const grid      = document.getElementById('gallery-grid');
  const heading   = document.getElementById('room-heading');
  const countEl   = document.getElementById('photo-count');
  let currentRoom = null;
  let lbImages    = [];
  let lbIndex     = 0;

  function showRoom(index) {
    currentRoom = index;
    const room = ROOMS[index];

    // Update heading
    const parts = room.name.split(' ');
    heading.innerHTML = parts.length > 1
      ? `${parts[0]} <em>${parts.slice(1).join(' ')}</em>`
      : room.name;
    countEl.textContent = `${room.images.length} photo${room.images.length !== 1 ? 's' : ''}`;

    // Update active button
    document.querySelectorAll('.room-btn').forEach((b, i) => {
      const active = i === index;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active);
    });

    // Clear + rebuild grid
    grid.innerHTML = '';
    lbImages = room.images;

    if (!room.images.length) {
      const msg = document.createElement('div');
      msg.className = 'no-photos';
      msg.innerHTML = `<p>No photos added yet for this room.</p>
        <p class="hint">Add image paths in the ROOMS config at the top of index.html</p>`;
      grid.appendChild(msg);
      return;
    }

    room.images.forEach((src, i) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `View photo ${i + 1} of ${room.name}`);

      const img = document.createElement('img');
      img.src = src;
      img.alt = `${room.name} — photo ${i + 1}`;
      img.loading = i === 0 ? 'eager' : 'lazy';

      // Handle broken images gracefully
      img.onerror = function() {
        this.style.opacity = '0.2';
        card.style.background = 'var(--cream-dark)';
        card.title = `Image not found: ${src}`;
      };

      const overlay = document.createElement('div');
      overlay.className = 'photo-overlay';
      overlay.innerHTML = `<div class="expand-icon">
        <svg viewBox="0 0 24 24" stroke-width="1.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </div>`;

      card.appendChild(img);
      card.appendChild(overlay);
      grid.appendChild(card);

      const open = () => openLightbox(i);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });

    // Close mobile menu
    closeMobileMenu();
  }

  // ── Lightbox ───────────────────────────────────────────
  const lb       = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lb-img');
  const lbCap    = document.getElementById('lb-caption');
  const lbCtr    = document.getElementById('lb-counter');
  const lbClose  = document.getElementById('lb-close');
  const lbPrev   = document.getElementById('lb-prev');
  const lbNext   = document.getElementById('lb-next');

  function openLightbox(i) {
    lbIndex = i;
    updateLb();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
  }

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  function updateLb() {
    lbImg.src = lbImages[lbIndex];
    lbImg.alt = `${ROOMS[currentRoom].name} — photo ${lbIndex + 1}`;
    lbCap.textContent = ROOMS[currentRoom].name;
    lbCtr.textContent = `${lbIndex + 1} / ${lbImages.length}`;
    lbPrev.style.opacity = lbImages.length > 1 ? '1' : '0.2';
    lbNext.style.opacity = lbImages.length > 1 ? '1' : '0.2';
  }

  lbClose.addEventListener('click', closeLightbox);
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

  lbPrev.addEventListener('click', () => {
    lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length;
    updateLb();
  });
  lbNext.addEventListener('click', () => {
    lbIndex = (lbIndex + 1) % lbImages.length;
    updateLb();
  });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; updateLb(); }
    if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % lbImages.length; updateLb(); }
  });

  // Touch swipe on lightbox
  let touchStartX = 0;
  lb.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 40) {
      lbIndex = dx < 0
        ? (lbIndex + 1) % lbImages.length
        : (lbIndex - 1 + lbImages.length) % lbImages.length;
      updateLb();
    }
  });

  // ── Mobile sidebar ─────────────────────────────────────
  const sidebar    = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menu-toggle');
  const overlay    = document.getElementById('overlay');

  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
  });
  overlay.addEventListener('click', closeMobileMenu);

  function closeMobileMenu() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  }

  // ── Show first room on load ─────────────────────────────
  showRoom(0);
})();
</script>
</body>
</html>
